components:
  schemas:
    BuyerDashboard:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    BuyerProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        buyer_name:
          type: string
          readOnly: true
        business_name:
          type: string
          maxLength: 255
        phone_number:
          type: string
          maxLength: 20
        industry:
          type: string
          maxLength: 255
        company_description:
          type: string
        address:
          type: string
        website:
          type: string
          format: uri
          maxLength: 200
        country:
          type: string
          maxLength: 100
        image:
          type: string
          format: uri
          nullable: true
      required:
      - buyer_name
      - id
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    CountryList:
      type: object
      properties:
        countries:
          type: array
          items:
            type: string
      required:
      - countries
    CustomToken:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    HealthCheck:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
      - message
      - status
    Logout:
      type: object
      properties:
        refresh:
          type: string
          description: Refresh token to blacklist
      required:
      - refresh
    MarketplaceProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        price:
          type: string
